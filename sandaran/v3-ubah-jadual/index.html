  const box = m => { const o = R[m.id];
    return `<div class="mbox ${m.final ? 'fin' : ''}">
      <div class="${o.done && o.winner === o.a ? 'w' : ''}"><span>${un(o.a)}</span><b>${sc(o, 'a')}</b></div>
      <div class="${o.done && o.winner === o.b ? 'w' : ''}"><span>${un(o.b)}</span><b>${sc(o, 'b')}</b></div>
      <small>${esc(m.label)}${o.auto ? ' · bye' : o.sched && !o.done ? ' · sedang main' : ''}</small></div>`; };
  const champ = tourChampion(S, R);
  const allDone = T.matches.every(m => R[m.id].done) && (T.format !== 'swiss' || T.swissRound >= S.tcfg.swissRounds) && (T.format !== 'pool' || T.koBuilt);
  let html = allDone && champ != null ? `<section class="card champ"><div style="font-size:42px">🏆</div><span class="lbl" style="margin:0">Juara</span><b>${esc(teamName(T.units[champ], nm))}</b></section>` : '';
  const tbl = (rows, qual) => `<table><thead><tr><th>#</th><th style="text-align:left">${S.mode === 'singles' ? 'Pemain' : 'Pasukan'}</th><th>Main</th><th>Mn</th><th>K</th><th>+/−</th></tr></thead><tbody>
    ${rows.map((r, i) => { const d = r.pf - r.pa; return `<tr><td>${i + 1}</td><td class="nm">${i < qual ? '<span title="Layak" style="color:var(--pri)">✔ </span>' : ''}${esc(teamName(T.units[r.u], nm))}</td><td>${r.mp}</td><td><b>${r.w}</b></td><td>${r.l}</td><td class="${d > 0 ? 'pos' : d < 0 ? 'neg' : ''}">${d > 0 ? '+' : ''}${d}</td></tr>`; }).join('')}</tbody></table>`;
  if (T.format === 'pool') html += T.groups.map((g, gi) => `<section class="card"><span class="lbl">Kumpulan ${'ABCDEFGH'[gi]}</span>${tbl(groupTable(S, R, gi), S.tcfg.adv)}</section>`).join('');
  if (T.format === 'swiss') html += `<section class="card"><span class="lbl">Jadual Swiss · pusingan ${T.swissRound}/${S.tcfg.swissRounds}</span>${tbl(swissTable(S, R), 0)}<p class="hint">Bye dikira sebagai menang.</p></section>`;
  const ko = T.matches.filter(m => m.stage === 'ko');
  if (ko.length) {
    const rounds = [...new Set(ko.filter(m => !m.third).map(m => m.rnd))].sort((a, b) => a - b);
    html += `<section class="card"><span class="lbl">Carta kalah mati</span><div class="bracket">
      ${rounds.map(rn => { const ms = ko.filter(m => m.rnd === rn && !m.third);
        return `<div class="bcol"><h4>${esc(ms[0].label.replace(/ \d+$/, ''))}</h4>${ms.map(box).join('')}</div>`; }).join('')}
    </div>${ko.filter(m => m.third).map(m => `<div style="max-width:220px;margin-top:10px">${box(m)}</div>`).join('')}
    <p class="hint">Leret ke kiri/kanan untuk lihat seluruh carta.</p></section>`;
  } else if (T.format === 'pool') html += `<section class="card"><div class="hint" style="margin:0">Carta kalah mati dibina selepas semua perlawanan kumpulan selesai (${S.tcfg.adv} teratas setiap kumpulan layak).</div></section>`;
  return html;
}
function shareRank(){
  const nm = nameMap(), {players, teams} = standings(S);
  const team = S.mode !== 'singles' && S.format !== 'kotc' && view.rankView === 'team';
  const rows = (team ? teams : players).filter(s => s.mp > 0);
  shareText(`🏆 Kedudukan — ${S.name}\n${FORMATS[S.format]}\n\n` + rows.map((s, i) =>
    `${i + 1}. ${team ? teamName(s.ids, nm) : nm[s.key]} — ${s.w}M ${s.l}K (${s.pf - s.pa >= 0 ? '+' : ''}${s.pf - s.pa})`).join('\n'));
}

/* ============ Statistik ============ */
function statsTab(){
  const T = computeStats(S, S.rounds.length), nm = nameMap();
  const seen = S.players.filter(p => p.active || T.st[p.id].eligible > 0);
  const act = S.players.filter(p => p.active && T.st[p.id].eligible > 0);
  const played = act.map(p => T.st[p.id].played);
  const minP = played.length ? Math.min(...played) : 0, maxP = played.length ? Math.max(...played) : 0;
  const rep = o => Object.values(o).reduce((a, n) => a + Math.max(0, n - 1), 0);
  const lockSet = new Set(S.locks.map(l => pk(l[0], l[1])));
  const partnerRep = Object.entries(T.partner).filter(([k]) => !lockSet.has(k)).reduce((a, [, n]) => a + Math.max(0, n - 1), 0);
  const quadRep = rep(T.quad);
  const n = act.length;
  const possible = S.mode === 'singles' ? 0 : n * (n - 1) / 2;
  const covered = Object.keys(T.partner).length;
  const row = p => {
    const s = T.st[p.id], open = view.open === p.id;
    const list = o => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([id, c]) => `${esc(nm[id])}${c > 1 ? ' ×' + c : ''}`).join(', ') || '-';
    return `<tr class="pl" onclick="view.open=view.open==='${p.id}'?null:'${p.id}';render()">
        <td class="${p.active ? '' : 'off'}">${S.mode === 'mixed' ? `<span class="dot ${p.g}"></span> ` : ''}${esc(p.name)}</td>
        <td>${s.played}</td><td>${s.rests}</td>${S.mode !== 'singles' ? `<td>${Object.keys(s.partners).length}</td>` : ''}<td>${Object.keys(s.opps).length}</td></tr>
      ${open ? `<tr class="det"><td colspan="5">${S.mode !== 'singles' ? `<b>Rakan:</b> ${list(s.partners)}<br>` : ''}<b>Lawan:</b> ${list(s.opps)}</td></tr>` : ''}`;
  };
  return `
  <section class="card">
    <span class="lbl">Gambaran keadilan sesi</span>
    <div class="kpis">
      <div class="kpi"><b>${S.rounds.length}</b><small>Pusingan dimainkan</small></div>
      <div class="kpi"><b>${minP}–${maxP}</b><small>Julat perlawanan setiap pemain${maxP - minP <= 1 ? ' ✅' : ''}</small></div>
      <div class="kpi"><b>${T.b2b}</b><small>Rehat berturut-turut${T.b2b === 0 ? ' ✅' : ''}</small></div>
      ${S.mode !== 'singles'
        ? `<div class="kpi"><b>${partnerRep}</b><small>Ulangan rakan sepasukan</small></div>
           <div class="kpi"><b>${covered}/${possible}</b><small>Gandingan rakan berbeza dicuba</small></div>
           <div class="kpi"><b>${quadRep}</b><small>Ulangan 4 orang sama segelanggang</small></div>`
        : `<div class="kpi"><b>${rep(T.opp)}</b><small>Ulangan lawan</small></div>`}
    </div>
  </section>
  <section class="card">
    <span class="lbl">Statistik pemain <span style="text-transform:none;font-weight:500">(tekan nama untuk butiran)</span></span>
    <table><thead><tr><th>Nama</th><th>Main</th><th>Rehat</th>${S.mode !== 'singles' ? '<th>Rakan</th>' : ''}<th>Lawan</th></tr></thead>
    <tbody>${seen.map(row).join('')}</tbody></table>
  </section>`;
}

/* ============ Ahli & tetapan (pertengahan sesi) ============ */
let newG = 'L';
function markDirty(){ S.dirty = true; save(); render(); }
function membersTab(){
  const act = S.players.filter(p => p.active), out = S.players.filter(p => !p.active);
  const mixed = S.mode === 'mixed', L = act.filter(p => p.g === 'L').length;
  const prow = p => `<div class="part ${p.active ? '' : 'out'}">
      <button class="chk ${p.active ? 'on' : ''}" aria-label="${p.active ? 'Hadir — tekan untuk keluarkan' : 'Tidak hadir — tekan untuk masukkan'}" onclick="toggleActive('${p.id}')">${p.active ? '✓' : ''}</button>
      <span class="av ${mixed ? p.g : ''}">${esc(initials(p.name))}</span>
      <input value="${esc(p.name)}" aria-label="Nama" onchange="renameS('${p.id}',this.value)">
      ${mixed ? gTag('S', p) : S.mode === 'ranked' ? kTag('S', p) : ''}</div>`;
  return `
  <section class="card">
    <div class="hrow"><span class="lbl" style="margin:0">Peserta · ${act.length}/${S.players.length}${mixed ? ` · ${L} L · ${act.length - L} P` : ''}</span></div>
    ${S.mode === 'ranked' ? kControls('S') : ''}
    <p class="hint" style="margin:6px 0 4px">Tanda ✓ = bermain. Buang tanda untuk pemain yang balik awal.</p>
    ${S.players.map(prow).join('')}
    <div class="prow" style="margin-top:12px">
      ${mixed ? `<button class="gtag ${newG}" onclick="newG=newG==='L'?'P':'L';render()">${newG === 'L' ? '♂ L' : '♀ P'}</button>` : ''}
      <input class="inp" id="newName" placeholder="＋ Tambah pemain (datang lewat)" onkeydown="if(event.key==='Enter')addPlayer()">
      <button class="btn primary" onclick="addPlayer()">Tambah</button>
    </div>
    <p class="hint">Perubahan digunakan mulai pusingan seterusnya, atau jana semula pusingan semasa dari tab Perlawanan.</p>
  </section>
  <section class="card">
    <div class="row2" style="margin:0">
      <div><span class="lbl">Gelanggang</span>${stepper('stepCourtsS', S.courts)}</div>
      <div><span class="lbl">Mod</span><div style="padding:10px 0;font-weight:700">${MICON[S.mode]} ${MODES[S.mode]}</div></div>
    </div>
    <p class="hint">${capHint(S.mode, S.courts, act.length)}</p>
  </section>
  ${settingsHTML('S')}
  ${S.mode !== 'singles' ? locksHTML('S') : ''}
  <section class="card">
    <span class="lbl">Nama sesi</span>
    <input class="inp" style="width:100%" value="${esc(S.name)}" onchange="S.name=this.value.trim()||S.name;save();render()">
  </section>`;
}
function stepCourtsS(d){ const v = Math.max(1, Math.min(8, S.courts + d)); if (v === S.courts) return; S.courts = v; markDirty(); }
function renameS(id, v){ const p = S.players.find(x => x.id === id); v = v.trim(); if (!v) return render(); p.name = v; save(); render(); }
function toggleActive(id){
  const p = S.players.find(x => x.id === id);
  if (!p.active && S.players.filter(x => x.active).length >= 40) return toast('Maksimum 40 pemain');
  p.active = !p.active;
  if (!p.active) S.locks = S.locks.filter(l => l[0] !== id && l[1] !== id);
  markDirty(); toast(p.active ? `${p.name} masuk semula` : `${p.name} keluar`);
}
function addPlayer(){
  const el = document.getElementById('newName');
  if (S.players.filter(x => x.active).length >= 40) return toast('Maksimum 40 pemain');
  const name = el.value.trim() || ('P' + (S.players.length + 1));
  S.players.push({id:uid(), name, g:newG, k:GRP[(S.ngrp || 2) - 1], active:true, joined:S.rounds.length});
  markDirty(); toast(`${name} ditambah`);
  setTimeout(() => { const e = document.getElementById('newName'); e && e.focus(); }, 0);
}

/* ============ Bunyi (Web Audio — tiada fail luar) ============ */
let AC = null;
function audio(){
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e) {}
  return AC;
}
document.addEventListener('pointerdown', audio, {passive:true});
function tone(freq, start, dur, type, vol){
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + start;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .02);
  g.gain.setValueAtTime(vol, t0 + dur - .05); g.gain.linearRampToValueAtTime(0, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + .05);
}
function horn(){
  [0, .8, 1.6].forEach(t => { tone(220, t, .6, 'sawtooth', .3); tone(277, t, .6, 'sawtooth', .2); });
  try { navigator.vibrate && navigator.vibrate([600, 200, 600, 200, 600]); } catch(e) {}
}
function beep(n){ for (let i = 0; i < n; i++) tone(880, i * .3, .15, 'sine', .3); }

/* ============ Pemasa perlawanan (setiap pusingan) ============ */
const TVWIN = /^#tv=/.test(location.hash);   // tetingkap TV berasingan (baca sahaja)
const overHidden = new Set();
const fmtT = ms => { const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const latest = () => S && S.rounds[S.rounds.length - 1];
function tmLeft(r){
  if (!r || !r.tm) return S.timerMins * 60000;
  return r.tm.run ? Math.max(0, r.tm.end - Date.now()) : r.tm.left;
}
function tmNew(){ return {left:S.timerMins * 60000, run:false, end:null, horn:false, warn:false}; }
function tmStart(){ const r = latest(); r.tm = r.tm || tmNew(); if (r.tm.left <= 0) r.tm = tmNew();
  r.tm.end = Date.now() + r.tm.left; r.tm.run = true; r.tm.horn = false; audio(); save(); render(); }
function tmPause(){ const r = latest(); if (!r.tm) return; r.tm.left = tmLeft(r); r.tm.run = false; save(); render(); }
function tmReset(){ const r = latest(); r.tm = tmNew(); overHidden.delete(S.rounds.length - 1); save(); render(); }
function tmAdd(min){ const r = latest(); r.tm = r.tm || tmNew();
  if (r.tm.run) r.tm.end += min * 60000; else r.tm.left = Math.max(0, r.tm.left + min * 60000);
  r.tm.horn = false; r.tm.warn = false; overHidden.delete(S.rounds.length - 1); save(); render(); }
function setMins(m){ S.timerMins = m; const r = latest(); if (r && (!r.tm || (!r.tm.run && !r.tm.horn))) r.tm = tmNew(); save(); render(); }
function timerCard(){
  const r = latest(), run = r.tm && r.tm.run;
  return `<section class="card">
    <div class="trow">
      <div><span class="lbl" style="margin:0">⏱ Pemasa · ${S.timerMins} min</span><div class="tbig tmr">${fmtT(tmLeft(r))}</div></div>
      <div class="tbtns">
        ${run ? `<button class="btn" onclick="tmPause()" aria-label="Jeda">⏸</button>` : `<button class="btn primary" onclick="tmStart()" aria-label="Mula">▶</button>`}
        <button class="btn" onclick="tmAdd(1)" aria-label="Tambah 1 minit">+1</button>
        <button class="btn" onclick="tmReset()" aria-label="Set semula">↺</button>
      </div>
    </div>
    <details${view.tmOpen ? ' open' : ''} ontoggle="view.tmOpen=this.open"><summary>Tetapan pemasa</summary>
      <div class="seg" style="grid-template-columns:repeat(4,1fr);margin:10px 0">${[10, 12, 15, 20].map(m => `<button class="${S.timerMins === m ? 'on' : ''}" onclick="setMins(${m})">${m} min</button>`).join('')}</div>
      <div class="sw"><div class="hint" style="margin:0">Mula automatik setiap pusingan baharu. Hon berbunyi bila masa tamat, bip 2 minit sebelum.</div>${toggle(S.timerAuto, 'setTimerAuto')}</div>
    </details>
  </section>`;
}
function setTimerAuto(v){ S.timerAuto = v; save(); }
function tick(){
  if (!S || !(view.screen === 'game' || view.screen === 'tv')) return;
  const ri = S.rounds.length - 1, r = S.rounds[ri]; if (!r) return;
  const left = tmLeft(r), zero = !!(r.tm && left === 0);
  document.querySelectorAll('.tmr').forEach(e => { e.textContent = fmtT(left); e.classList.toggle('low', left > 0 && left <= 60000); e.classList.toggle('zero', zero); });
  const ov = document.getElementById('tvover'); if (ov) ov.style.display = zero && !overHidden.has(ri) ? 'grid' : 'none';
  if (r.tm && r.tm.run) {
    if (!r.tm.warn && left > 0 && left <= 120000 && S.timerMins > 2) { r.tm.warn = true; beep(2); if (!TVWIN) save(); }
    if (left === 0) {
      r.tm.run = false; r.tm.left = 0; r.tm.horn = true; horn();
      if (!TVWIN) { save(); toast('⏱ Masa tamat!'); if (view.screen === 'game') render(); }
    }
  }
}
setInterval(tick, 500);

/* ============ Papan TV / projektor ============ */
let wakeLock = null;
async function keepAwake(){ try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch(e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && view.screen === 'tv') keepAwake(); });
function openTV(){ view.screen = 'tv'; keepAwake(); render(); }
function exitTV(){ if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); view.screen = 'game'; render(); }
function fullTV(){ const d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen().catch(() => toast('Skrin penuh tidak disokong')); }
function popTV(){
  const w = window.open(location.pathname + '#tv=' + S.id, 'picklemix-tv', 'popup,width=1280,height=720');
  if (!w) toast('Benarkan pop-up untuk buka tetingkap TV'); else toast('Seret tetingkap itu ke skrin TV, kemudian tekan ⛶');
}
function renderTV(){
  const ri = S.rounds.length - 1, r = S.rounds[ri], nm = nameMap(), kotc = S.format === 'kotc';
  const n = r.courts.length, cols = n <= 2 ? n : n <= 4 ? 2 : n <= 6 ? 3 : 4;
  let board = '';
  if (scoringOn(S)) {
    const st = standings(S), team = S.mode !== 'singles' && (S.format === 'rr' || TOUR.has(S.format));
    const rows = (team ? st.teams : st.players).filter(s => s.mp > 0).slice(0, 8);
    if (rows.length) board = `<div class="tvbox"><h3>🏆 Kedudukan</h3>${rows.map((s, i) => `<div class="r"><span>${['🥇', '🥈', '🥉'][i] || (i + 1) + '.'} ${esc(team ? teamName(s.ids, nm) : nm[s.key])}</span><b>${s.w}M ${s.pf - s.pa >= 0 ? '+' : ''}${s.pf - s.pa}</b></div>`).join('')}</div>`;
  }
  let champ = '';
  if (TOUR.has(S.format) && S.tour && S.tour.format === S.format) {
    const R = tourResolve(S, S.rounds.length), all = S.tour.matches.filter(m => !R[m.id].auto);
    champ = `<div class="tvbox"><h3>📊 Kejohanan</h3><div class="r"><span>Perlawanan selesai</span><b>${all.filter(m => R[m.id].done).length}/${all.length}</b></div></div>`;
  }
  const team = (c, sd) => `<div class="t ${scored(c) ? ((sd === 'a') === (c.sa > c.sb) ? 'win' : 'lose') : ''}">${c[sd].map(id => esc(nm[id])).join('<br>')}</div>`;
  app.innerHTML = `<div class="tv">
    <header class="tvh">
      <div><b>${esc(S.name)}</b><span>${FORMATS[S.format]} · ${MODES[S.mode]}</span></div>
      <div class="tvr">PUSINGAN ${ri + 1}</div>
      <div class="tmr tvt">${fmtT(tmLeft(r))}</div>
      <div class="tvbtn">
        ${TVWIN ? '' : (r.tm && r.tm.run ? `<button onclick="tmPause()" title="Jeda pemasa">⏸</button>` : `<button onclick="tmStart()" title="Mula pemasa">▶</button>`)}
        <button onclick="audio();beep(1)" title="Uji / aktifkan bunyi">🔊</button>
        ${TVWIN ? '' : `<button onclick="popTV()" title="Buka di tetingkap/skrin lain">🖥</button>`}
        <button onclick="fullTV()" title="Skrin penuh">⛶</button>
        ${TVWIN ? '' : `<button onclick="exitTV()" title="Keluar">✕</button>`}
      </div>
    </header>
    <div class="tvbody">
      <div class="tvcourts" style="grid-template-columns:repeat(${cols},1fr)">
        ${r.courts.map((c, i) => `<div class="tvc ${(kotc && i === 0) || (c.label && /Akhir$/.test(c.label)) ? 'king' : ''}">
          <div class="h"><span>${kotc && i === 0 ? '👑 GELANGGANG RAJA' : 'GELANGGANG ' + (i + 1)}</span><span>${c.label ? esc(c.label) : ''}</span></div>
          <div class="m">${team(c, 'a')}<div>${scored(c) || Number.isFinite(c.sa) ? `<div class="s">${c.sa ?? 0} : ${c.sb ?? 0}</div>` : '<div class="vs" style="margin:auto">VS</div>'}</div>${team(c, 'b')}</div>
        </div>`).join('')}
      </div>
      <aside class="tvside">
        <div class="tvbox"><h3>☕ Berehat (${r.rest.length})</h3><div class="tvrest">${r.rest.length ? r.rest.map(id => `<span>${esc(nm[id])}</span>`).join('') : '<span>Tiada</span>'}</div></div>
        ${champ}${board}
        <div class="tvfoot">PickleMix · mrsmsas.github.io/picklemix</div>
      </aside>
    </div>
    <div class="tvover" id="tvover" onclick="overHidden.add(${ri});this.style.display='none'">⏱ MASA TAMAT</div>
  </div>`;
  tick();
}
if (TVWIN) {
  window.addEventListener('storage', e => {
    if (e.key !== LS) return;
    try { db = Object.assign(db, JSON.parse(e.newValue)); db.sessions.forEach(norm); } catch(err) { return; }
    S = db.sessions.find(s => s.id === location.hash.slice(4)) || S;
    render();
  });
}

/* ============ Render ============ */
function render(){
  app.classList.toggle('wide', view.screen === 'tv');
  if (view.screen === 'tv' && S) renderTV();
  else if (view.screen === 'setup') renderSetup();
  else if (view.screen === 'game' && S) renderGame();
  else { view.screen = 'home'; renderHome(); }
}
if (TVWIN) {
  S = db.sessions.find(s => s.id === location.hash.slice(4)) || null;
  if (S) { view.screen = 'tv'; keepAwake(); }
}
render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
